# Build the Social Europe EmDash image and push it to GHCR; Bunny Magic Containers pulls ghcr.io/<owner>/se-web:latest.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Bunny Magic Containers app "SE EmDash": pin the container template to the digest just built, then deploy
      # (a plain deploy re-runs the digest already pinned in the template, it does not re-resolve :latest)
      - name: Deploy on Bunny
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          curl -sf -X PATCH -H "AccessKey: $BUNNY_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
            -d "{\"imageDigest\": \"$DIGEST\"}" https://api.bunny.net/mc/apps/M2IE2fr9dVHjjff/containers/M2IE2fr9dVHjjff-CXd3 >/dev/null && echo "template pinned to $DIGEST"
          curl -sf -X POST -H "AccessKey: $BUNNY_API_KEY" -H "Accept: application/json" \
            https://api.bunny.net/mc/apps/M2IE2fr9dVHjjff/deploy && echo "deploy triggered"
