<style type="text/css">
  /* Design tokens + wrapper padding */
  #mlb2-6011518 {
    --brand: #d0253c;
    --text: #191919;
    --bg: #faf6f4;
    --input-border: #ccc;
    --radius: 4px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    padding: 14px 0 24px 0;
  }
 
  /* Defensive reset against theme typography */
  #mlb2-6011518 * {
    box-sizing: border-box;
    font-family: var(--font) !important;
    text-transform: none !important;
    letter-spacing: normal !important;
  }
 
  /* Wrapper */
  #mlb2-6011518 .ml-form-embedWrapper {
    background: var(--bg);
    width: 100%;
    padding: 41px 36px 26px 36px;
    display: inline-block;
  }
 
  #mlb2-6011518 .ml-form-embedContent {
    text-align: left;
    margin: 0 0 20px 0;
  }
 
  /* Typography */
  #mlb2-6011518 h4 {
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 10px 0;
    text-align: left;
    word-break: break-word;
  }
  #mlb2-6011518 p {
    color: var(--text);
    font-size: 20px;
    line-height: 24px;
    margin: 0 0 10px 0;
    text-align: left;
  }
  #mlb2-6011518 p a { color: var(--text); text-decoration: underline; }
 
  /* Visually-hidden label for screen readers / password managers */
  #mlb2-6011518 .ml-screen-reader-text {
    position: absolute;
    left: -10000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
 
  /* Form row — MOBILE FIRST: stacked (button below the field) */
  #mlb2-6011518 form { width: 100%; }
  #mlb2-6011518 .ml-form-horizontalRow { width: 100%; display: block; }
  #mlb2-6011518 .ml-input-horizontal { width: 100%; }
  #mlb2-6011518 .ml-button-horizontal { width: 100%; margin-top: 10px; }
  #mlb2-6011518 .horizontal-fields { width: 100%; }
 
  /* Input */
  #mlb2-6011518 input[type="email"] {
    background: #fff;
    color: #333;
    border: 1px solid var(--input-border);
    border-radius: var(--radius);
    font-size: 16px;
    line-height: 21px;
    padding: 12px 10px;
    width: 100%;
  }
 
  /* Submit button */
  #mlb2-6011518 .btn-submit {
    background: var(--brand);
    border: 1px solid var(--brand);
    border-radius: var(--radius);
    box-shadow: none;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    line-height: 20px;
    padding: 12px 10px;
    width: 100%;
    white-space: nowrap;
  }
  #mlb2-6011518 .btn-submit:hover {
    background: var(--text);
    border-color: var(--text);
  }
 
  /* Desktop and tablet (611px and up): field and button side by side */
  @media only screen and (min-width: 611px) {
    #mlb2-6011518 .ml-form-horizontalRow {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    #mlb2-6011518 .ml-input-horizontal { flex: 1 1 auto; width: auto; }
    #mlb2-6011518 .ml-button-horizontal { flex: 0 0 30%; width: auto; margin-top: 0; }
  }
 
  /* GDPR consent row */
  #mlb2-6011518 .ml-form-embedPermissions {
    text-align: left;
    width: 100%;
    padding-bottom: 20px;
  }
  #mlb2-6011518 .ml-form-embedPermissionsOptionsCheckbox {
    margin: 15px 0 10px 0;
  }
  #mlb2-6011518 .ml-form-embedPermissionsOptionsCheckbox label {
    font-weight: 400;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  #mlb2-6011518 .ml-form-embedPermissionsOptionsCheckbox input[type="checkbox"] {
    appearance: auto;
    -webkit-appearance: auto;
    accent-color: var(--brand);
    width: 24px;
    height: 24px;
    margin: 2px 10px 0 0;
  }
  #mlb2-6011518 .ml-form-embedPermissionsOptionsCheckbox .label-text {
    color: #000;
    font-size: 14px;
    line-height: 18px;
    text-align: left;
  }
</style>
