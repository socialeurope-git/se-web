<script id="awrm-client-rotation">
(function(){var els=Array.prototype.slice.call(document.querySelectorAll("#right-sidebar aside.se-ad"));var N=els.length;if(N<2){return;}var p=els[0].parentNode;p.style.display='flex';p.style.flexDirection='column';p.style.gap='40px';var o;try{var k='awrm_rot',pv=parseInt(localStorage.getItem(k),10);if(isNaN(pv)){pv=Math.floor(Math.random()*N);}o=((pv%N)+N)%N;localStorage.setItem(k,o+1);}catch(e){o=Math.floor(Math.random()*N);}for(var j=0;j<N;j++){els[j].style.order=((j-o)%N+N)%N;els[j].style.marginBottom='0';}})();
</script>
