# Build the Social Europe EmDash image and push it to GHCR, one tag per host (the site URL is baked in at build time,
# see Dockerfile): ghcr.io/<owner>/se-web:staging and :production. Bunny Magic Containers runs the pinned digest.
# The backup sidecar (backup/Dockerfile: Litestream + rclone) is built as ghcr.io/<owner>/se-web-backup:latest.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - env: staging
            site_url: https://mc-hdck3f7ufk.bunny.run
          - env: production
            site_url: https://www.socialeurope.eu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            EMDASH_SITE_URL=${{ matrix.site_url }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.env }}
            ghcr.io/${{ github.repository }}:${{ matrix.env }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Bunny Magic Containers app "SE EmDash" (staging): pin the container template to the digest just built, then
      # deploy (a plain deploy re-runs the digest already pinned in the template, it does not re-resolve the tag)
      - name: Deploy on Bunny (staging)
        if: matrix.env == 'staging'
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          curl -sf -X PATCH -H "AccessKey: $BUNNY_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
            -d "{\"imageTag\": \"staging\", \"imageDigest\": \"$DIGEST\"}" https://api.bunny.net/mc/apps/M2IE2fr9dVHjjff/containers/M2IE2fr9dVHjjff-CXd3 >/dev/null && echo "template pinned to $DIGEST"
          curl -sf -X POST -H "AccessKey: $BUNNY_API_KEY" -H "Accept: application/json" \
            https://api.bunny.net/mc/apps/M2IE2fr9dVHjjff/deploy && echo "deploy triggered"
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backup
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backup:latest
            ghcr.io/${{ github.repository }}-backup:${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
