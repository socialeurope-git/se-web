# Build the Social Europe EmDash image and push it to GHCR; Bunny Magic Containers pulls ghcr.io/<owner>/se-web:latest.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Bunny Magic Containers app "SE EmDash" pulls :latest on deploy (imagePullPolicy always)
      - name: Deploy on Bunny
        run: |
          curl -sf -X POST -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" -H "Accept: application/json" \
            https://api.bunny.net/mc/apps/M2IE2fr9dVHjjff/deploy && echo "deploy triggered"
